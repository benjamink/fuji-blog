server {
    listen 80;
    listen [::]:80;
    server_name fujiblogger.skdev.org;

    # Let's Encrypt ACME challenge — served from the filesystem, not proxied
    location /.well-known/acme-challenge/ {
        root /var/www/fujiblogger.skdev.org;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fujiblogger.skdev.org;

    ssl_certificate     /etc/letsencrypt/live/fujiblogger.skdev.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fujiblogger.skdev.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy all requests to the fujiblogger Docker container
    location / {
        proxy_pass         http://localhost:8000;
        proxy_http_version 1.1;

        # Standard proxy headers so the app sees the real client IP and scheme
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (uvicorn uses it for hot-reload; harmless in prod)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Give the backend enough time to respond to slow FujiNet uploads
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
