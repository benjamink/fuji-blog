[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fujiblogger-server"
version = "0.1.0"
description = "FujiBlogger — Apple IIc Markdown Blog Server"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Author", email = "author@example.com"}]
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "markdown>=3.5.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]


