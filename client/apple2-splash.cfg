# apple2-splash.cfg — FujiNet-style linker config for the HGR splash SYS file.
#
# Based on fujinet-config/src/apple2/config.cfg (Apache 2.0 licence).
#
# Memory layout:
#   $2000-$3FFF  HGR page 1 (the pre-rendered logo.hgr image)
#   $2000-$2002  JMP $4000  (overwrite segment — first 3 bytes of HGR data)
#   $4000+       cc65 startup + C code
#
# ProDOS loads SYS files to $2000 and executes from there.  The JMP
# immediately transfers control to the startup code at $4000 while
# the logo image sits in the HGR display page.

FEATURES {
    STARTADDRESS: default = $2000;
}
SYMBOLS {
    __EXEHDR__:    type = import;
    __FILETYPE__:  type = weak, value = $00FF;   # ProDOS SYS
    __STACKSIZE__: type = weak, value = $0800;   # 2 KB stack
    __HIMEM__:     type = weak, value = $BF00;
    __LCADDR__:    type = weak, value = $D400;
    __LCSIZE__:    type = weak, value = $0C00;
}
MEMORY {
    ZP:     file = "", define = yes, start = $0080,        size = $001A;
    HEADER: file = %O,               start = $2000 - $003A, size = $003A;
    MAIN:   file = %O, define = yes, start = $2000,        size = $BF00 - $2000;
    BSS:    file = "",               start = $8000,        size = $2F00;
    LC:     file = "", define = yes, start = __LCADDR__,   size = __LCSIZE__;
    LOW:    file = "", define = yes, start = $0800,        size = $2000 - $0800;
}
SEGMENTS {
    ZEROPAGE: load = ZP,             type = zp;
    EXEHDR:   load = HEADER,         type = ro,  optional = yes;
    HGR:      load = MAIN,           type = ro;                    # logo.hgr at $2000
    STARTUP:  load = MAIN,           type = ro,  start = $4000;   # cc65 startup at $4000
    LOWCODE:  load = MAIN,           type = ro,  optional = yes;
    CODE:     load = MAIN,           type = ro;
    RODATA:   load = MAIN,           type = ro;
    DATA:     load = MAIN,           type = rw;
    INIT:     load = MAIN,           type = rw;
    ONCE:     load = MAIN,           type = ro,  define   = yes;
    LC:       load = MAIN, run = LC, type = ro,  optional = yes;
    BSS:      load = BSS,            type = bss, define   = yes;
    LOWBSS:   load = LOW,            type = bss, optional = yes;
    JMP:      load = MAIN,           type = overwrite, start = $2000;  # JMP $4000
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
